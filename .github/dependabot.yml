version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      wgpu-stack:
        patterns: ["wgpu*", "glyphon", "cosmic-text"]
      wayland:
        patterns: ["smithay-client-toolkit", "wayland-*", "calloop*"]
      macos:
        patterns: ["objc2*", "core-foundation"]
      minor-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    # winit 0.30 pins objc2 0.5, so these move together with the winit 0.31 migration.
    # Ranges, not semver-major: Dependabot reads 0.30 -> 0.31 as a minor update.
    ignore:
      - dependency-name: "winit"
        versions: [">= 0.31"]
      - dependency-name: "objc2"
        versions: [">= 0.6"]
      - dependency-name: "objc2-app-kit"
        versions: [">= 0.3"]
    commit-message:
      prefix: "Chore"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # Its refs select a Rust toolchain (`@1.89` is the MSRV job), not an action release.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    commit-message:
      prefix: "Chore"
