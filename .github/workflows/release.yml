name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check the tag matches the crate version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "olsvr") | .version')
          if [ "v${VERSION}" != "${TAG_NAME}" ]; then
            echo "Tag ${TAG_NAME} does not match the locked crate version ${VERSION}" >&2
            exit 1
          fi

      - name: Draft release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${TAG_NAME}^" 2>/dev/null || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..}${TAG_NAME}"
          features=$(git log --format='%s' "$RANGE" | sed -n 's/^Feature: /- /p')
          fixes=$(git log --format='%s' "$RANGE" | sed -n 's/^Fix: /- /p')
          : > release-notes.md
          if [ -n "$features" ]; then printf '### Features\n\n%s\n\n' "$features" >> release-notes.md; fi
          if [ -n "$fixes" ]; then printf '### Fixes\n\n%s\n\n' "$fixes" >> release-notes.md; fi
          if [ ! -s release-notes.md ]; then echo "Maintenance release." > release-notes.md; fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --verify-tag --draft --title "$TAG_NAME" --notes-file release-notes.md
