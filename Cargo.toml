[package]
name = "olsvr"
version = "0.1.6"
edition = "2024"
description = "OLED screensaver for Wayland"
license = "MIT"
repository = "https://github.com/laveez/olsvr"
keywords = ["wayland", "screensaver", "oled", "rust"]
categories = ["command-line-utilities"]

[dependencies]
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wgpu = "28"
glyphon = "0.10"
calloop = { version = "0.14", features = ["signals"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
rand = "0.10"
raw-window-handle = "0.6"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1.0"
dialoguer = "0.12"
dbus = "0.9"
log = "0.4"
env_logger = "0.11"
